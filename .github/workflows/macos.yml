name: macos-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'

permissions:
  contents: write

jobs:
  build:
    name: 编译并打包 .app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: 编译
        id: build
        continue-on-error: true
        working-directory: macos
        run: |
          set +e
          swift build -c release > /tmp/build.log 2>&1
          status=$?
          tail -100 /tmp/build.log
          exit $status

      - name: 失败时把日志推回 ci-logs 分支（供本地查看）
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p .ci
          cp /tmp/build.log .ci/last-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/last-build.log
          git commit -m "ci: 编译失败日志 [skip ci]" || true
          git push --force origin HEAD:ci-logs

      - name: 编译失败则终止
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 组装 TokenPanel.app
        working-directory: macos
        run: |
          set -euo pipefail
          BIN_PATH=$(swift build -c release --show-bin-path)
          APP="$RUNNER_TEMP/TokenPanel.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/wb"

          cp "$BIN_PATH/TokenPanel" "$APP/Contents/MacOS/TokenPanel"
          chmod +x "$APP/Contents/MacOS/TokenPanel"
          cp Resources/Info.plist "$APP/Contents/Info.plist"

          # WorkBuddy 查询脚本随包分发（与 Windows 版共用同一份 Node 实现）
          cp ../lib/wb/wb_query.js ../lib/wb/grab_cookie.js "$APP/Contents/Resources/wb/"

          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

          /usr/bin/ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/TokenPanel-macos.zip"
          ls -lh "$RUNNER_TEMP/TokenPanel-macos.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TokenPanel-macOS
          path: ${{ runner.temp }}/TokenPanel-macos.zip
          if-no-files-found: error
          retention-days: 90
